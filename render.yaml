services:
  - type: web
    name: diligent-smb-platform
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: USE_MOCK_FALLBACK
        value: "true"
